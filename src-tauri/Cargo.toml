[package]
name = "skillshub"
version = "1.2.0"
description = "AI Agent Skills Hub"
authors = ["yufenglyu"]
license = "Apache-2.0"
edition = "2021"
default-run = "skillshub"

[lib]
name = "skills_manage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "skillshub"
path = "src/main.rs"

# Build-time helper only. Gate behind a feature so `tauri build` does not try to
# bundle it (universal macOS packaging expects every [[bin]] under the lipo output).
# The source lives under src/build/ (not src/bin/) so tauri-cli's src/bin scan does
# not pick it up and try to bundle it as prepare_config_dir.exe (which broke WiX
# light with LGHT0103 when the file was absent from the target dir).
[[bin]]
name = "prepare_config_dir"
path = "src/build/prepare_config_dir.rs"
required-features = ["prepare-config"]

[features]
default = []
prepare-config = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
yaml-edit = "0.3.2"
sha2 = "0.10"
notify = "8"
dunce = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
quick-xml = "0.37"
percent-encoding = "2"
httpdate = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
